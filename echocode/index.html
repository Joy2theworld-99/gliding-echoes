<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Echo Code Translator</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: #eee;
      padding: 30px;
    }
    textarea {
      width: 100%;
      height: 120px;
      font-family: 'Courier New';
      font-size: 18px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
    }
    #output {
      margin-top: 20px;
      background-color: white;
      padding: 15px;
      font-size: 22px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>Echo Code Translator</h1>
  <label><strong>Enter Text:</strong></label><br>
  <textarea id="inputText"></textarea><br>

  <button onclick="translateToEchoCode()">Translate to Echo Code</button>
  <button onclick="translateToEnglish()">Translate to English</button>
  <button onclick="clearText()">Clear</button>
  <button onclick="exportText()">Export</button>

  <div id="output"></div>

  <script>
    const symbolMap = {
      A: "&", B: ":", C: "(", D: "]", E: "=", F: "^", G: "[",
      H: ")", I: "!", J: "`", K: "/", L: "@", M: "-", N: "_",
      O: "*", P: ";", Q: "?", R: ">", S: "~", T: "+", U: "$",
      V: "<", W: """, X: "#", Y: "_", Z: "%"
    };

    const reverseMap = {};
    for (const [letter, symbol] of Object.entries(symbolMap)) {
      reverseMap[symbol] = letter;
    }

    const punctuationMap = {
      "{'}": "'", "{:}": ":", "{?}": "?"
    };
    const reversePunctuationMap = {};
    for (const [wrapped, char] of Object.entries(punctuationMap)) {
      reversePunctuationMap[char] = wrapped;
    }

    function translateToEchoCode() {
      const input = document.getElementById("inputText").value.toUpperCase();
      let result = "";
      for (const char of input) {
        if (reversePunctuationMap[char]) {
          result += reversePunctuationMap[char] + " ";
        } else if (symbolMap[char]) {
          result += symbolMap[char] + " ";
        } else if (char === ' ') {
          result += ", ";
        } else {
          result += char + " ";
        }
      }
      document.getElementById("output").innerText = result.trim();
    }

    function translateToEnglish() {
      const input = document.getElementById("inputText").value.trim();
      const tokens = input.split(/\s+/);
      let result = "";
      for (const token of tokens) {
        if (punctuationMap[token]) {
          result += punctuationMap[token];
        } else if (token === ",") {
          result += " ";
        } else if (reverseMap[token]) {
          result += reverseMap[token];
        } else {
          result += token;
        }
      }
      document.getElementById("output").innerText = result;
    }

    function clearText() {
      document.getElementById("inputText").value = "";
      document.getElementById("output").innerText = "";
    }

    function exportText() {
      const textToSave = document.getElementById("output").innerText;
      const blob = new Blob([textToSave], { type: "text/plain" });
      const link = document.createElement("a");
      link.download = "echo_code_output.txt";
      link.href = window.URL.createObjectURL(blob);
      link.click();
    }
  </script>
</body>
</html>
